[server]
enableStaticServing = true

[theme]
base = "dark"
primaryColor = "#E9B95B"
backgroundColor = "#061425"
secondaryBackgroundColor = "#0A2138"
textColor = "#EAF2FA"
font = "Segoe UI, sans-serif"
headingFont = "Bahnschrift, Arial, sans-serif"
headingFontWeights = 400
baseRadius = "0rem"
showWidgetBorder = true
borderColor = "#29445C"

[theme.sidebar]
backgroundColor = "#071627"
textColor = "#EAF2FA"
font = "Segoe UI, sans-serif"
headingFont = "Bahnschrift, Arial, sans-serif"
